name: Build and Publish Debian Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish PassForge
    runs-on: ubuntu-26.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            extra-cmake-modules \
            qt6-base-dev \
            qt6-declarative-dev \
            libplasma-dev \
            debhelper \
            dpkg-dev \
            git \
            python3

      - name: Verify tag matches Debian package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(dpkg-parsechangelog -S Version)"

          echo "Git tag version: $TAG_VERSION"
          echo "Debian package version: $PACKAGE_VERSION"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Git tag does not match debian/changelog version."
            exit 1
          fi

      - name: Build Debian package
        run: |
          python3 ./release-passforge.py

      - name: Verify package checksum
        run: |
          cd release
          sha256sum --check ./*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ARGS=()

          if [[ "$GITHUB_REF_NAME" == *"~test"* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            release/*.deb \
            release/*.sha256 \
            --title "PassForge $GITHUB_REF_NAME" \
            --generate-notes \
            "${RELEASE_ARGS[@]}"